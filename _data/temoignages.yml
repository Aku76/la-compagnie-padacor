# « Iels parlent de nous » — retours du public et des programmateur·rices.
# (Textes de démonstration à remplacer par de vrais avis.)

- texte: "On est venu·es pour rire, on est reparti·es avec des étoiles plein la tête. Du grand art de l'instant."
  source: "Le public du festival, Caen"

- texte: "Une troupe qui transforme une salle en guinguette le temps d'une soirée. Rare et précieux."
  source: "Une programmatrice normande"

- texte: "Jamais deux fois le même spectacle, jamais deux fois le même rire. On y retourne."
  source: "Spectateur·rices fidèles, Rouen"
